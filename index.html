<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Склад"><title>Склад — учёт остатков</title><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#131720;--panel2:#1b202b;--line:#292f3b;--text:#f5f7fb;--muted:#9ba4b3;--green:#b8e986;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));font-size:16px}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0}header{padding:22px 18px 14px;position:sticky;top:0;background:rgba(9,11,16,.94);backdrop-filter:blur(18px);z-index:5;border-bottom:1px solid #ffffff0a}.top{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:800}.title{font-size:30px;font-weight:850;margin:5px 0 0;letter-spacing:-.04em}.iconbtn{width:46px;height:46px;border-radius:15px;background:var(--panel2);font-size:25px;display:grid;place-items:center;border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px 11px}.stat strong{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted);display:block;margin-top:3px}main{padding:16px;max-width:760px;margin:auto}.searchrow{display:flex;gap:9px;margin-bottom:13px}.search{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;color:var(--text)}.filter{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);margin-bottom:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:19px 2px 10px}.sectionhead h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}.product{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.product.low{border-color:#ff747478}.pname{font-weight:750;font-size:15px;line-height:1.3;overflow-wrap:anywhere}.pcat,.stocknum{color:var(--muted);font-size:12px;margin-top:5px}.stockline{display:flex;align-items:center;gap:7px;margin-top:8px}.lowtag{font-size:10px;color:var(--red);background:#ff74741f;border-radius:7px;padding:4px 6px;font-weight:800}.controls{display:flex;align-items:center;gap:6px}.qty{min-width:22px;text-align:center;font-size:19px;font-weight:850}.qty.lowqty{color:var(--red)}.step{width:39px;height:45px;border-radius:13px;background:var(--panel2);border:1px solid #343b48;font-size:24px}.step.plus{background:var(--green);color:#15200c;border-color:var(--green)}.mini{background:transparent;color:var(--muted);font-size:20px;padding:5px 2px}.empty{border:1px dashed #39404d;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#090b10ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:10;display:flex;gap:9px}.primary,.secondary{border-radius:16px;padding:15px 14px;font-weight:800}.primary{background:var(--green);color:#14200d;flex:1}.secondary{background:var(--panel2);border:1px solid var(--line)}.overlay{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end;justify-content:center;padding:12px}.overlay.open{display:flex}.modal{width:100%;max-width:560px;background:#151922;border:1px solid #343b48;border-radius:24px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.modal h2{margin:0 0 18px;font-size:22px}.field{display:block;margin-bottom:14px}.field span{display:block;font-size:12px;color:var(--muted);margin:0 0 7px 2px}.field input,.field select{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#0c0f15;color:var(--text)}.modalactions{display:flex;gap:9px;margin-top:20px}.modalactions button{flex:1}.danger{background:#ff74741f;color:var(--red);border:1px solid #ff74744d;border-radius:14px;padding:13px;font-weight:700}.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:14px 2px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#e5f4d6;color:#18210f;padding:11px 16px;border-radius:12px;font-weight:750;font-size:13px;z-index:40;display:none}@media(min-width:600px){main{padding:20px 24px}header{padding-left:24px;padding-right:24px}}
</style></head><body><header><div class="top"><div><div class="eyebrow">Учёт остатков</div><div class="title">Склад<span style="color:var(--green)">.</span></div></div><button class="iconbtn" id="exportBtn" aria-label="Экспорт">⇩</button></div><div class="stats"><div class="stat"><strong id="totalKinds">0</strong><span>позиций</span></div><div class="stat"><strong id="totalUnits">0</strong><span>всего единиц</span></div><div class="stat"><strong id="lowCount">0</strong><span>ниже минимума</span></div></div></header><main><div class="searchrow"><input class="search" id="search" placeholder="⌕ Найти товар…" autocomplete="off"><button class="iconbtn" id="clearSearch">×</button></div><select class="filter" id="categoryFilter"><option value="">Все категории</option></select><div class="sectionhead"><h2 id="listTitle">Все товары</h2><span class="count" id="visibleCount"></span></div><div id="productList"></div><p class="hint">Минимальный остаток для каждой позиции — 7 шт. Красным отмечаются товары ниже минимума. Данные сохраняются в браузере этого устройства; для синхронизации между устройствами потребуется облачное хранилище.</p></main><div class="bottom"><button class="secondary" id="exportCsv">Экспорт CSV</button><button class="primary" id="addBtn">＋ Добавить товар</button></div><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">Новый товар</h2><form id="productForm"><label class="field"><span>Название</span><input id="nameInput" required maxlength="90" placeholder="Например, Corona Extra"></label><label class="field"><span>Категория</span><select id="categoryInput" required></select></label><label class="field"><span>Количество на складе</span><input id="qtyInput" type="number" min="0" step="1" value="0" required inputmode="numeric"></label><label class="field"><span>Минимальный остаток</span><input id="minInput" type="number" min="0" step="1" value="7" required inputmode="numeric"></label><div class="modalactions"><button type="button" class="secondary" id="cancelBtn">Отмена</button><button type="submit" class="primary">Сохранить</button></div><button type="button" class="danger" id="deleteBtn" style="display:none;width:100%;margin-top:10px">Удалить товар</button></form></div></div><div class="toast" id="toast"></div>
<script>
const categories=["Медовуха Mjolnir","Сидр","Пиво Б/А","Пиво","Лимонад Волчек","Берн","Сок Sandal","Газировка импорт"];
const starter=[["Медовуха Mjolnir","Кровь Йотуна"],["Медовуха Mjolnir","Чёрный Вепрь"],["Медовуха Mjolnir","Хель Владычица"],["Медовуха Mjolnir","Поцелуй Фреи"],["Сидр","Дальняя дача №1"],["Сидр","Дальняя дача №2"],["Сидр","Дальняя дача №3"],["Сидр","Chester’s Яблоко сладкое"],["Сидр","Chester’s Вишня"],["Сидр","Chester’s Яблоко сухое"],["Сидр","Chester’s Груша"],["Пиво Б/А","Clausthaler"],["Пиво Б/А","Stracovice"],["Пиво","Наглецы из Воронежа Pils"],["Пиво","Наглецы из Воронежа Weissbier"],["Пиво","Наглецы из Воронежа Dark Lager"],["Пиво","Наглецы из Воронежа Blanche"],["Пиво","Corona Extra"],["Пиво","Guinness Draught"],["Пиво","Liebenweiss"],["Пиво","Paulaner Hefe Weissbier"],["Пиво","Paulaner Munchner Hell"],["Пиво","Tarkos White Rabbit"],["Пиво","Tarkos Mad Hatter"],["Пиво","Tarkos Dva Bobra Lezak"],["Пиво","Tarkos Dva Bobra Weissbier"],["Пиво","Tarkos Ceska Koruna"],["Лимонад Волчек","Груша личи"],["Лимонад Волчек","Цитрус микс"],["Лимонад Волчек","Грейпфрут гибискус"],["Лимонад Волчек","Манго кокос"],["Лимонад Волчек","Арбуз"],["Берн","Тропик"],["Берн","Яблоко киви"],["Берн","Оригинал"],["Берн","Сочная"],["Берн","Персик манго"],["Сок Sandal","Сок Sandal"],["Газировка импорт","Газировка импорт"]];
const KEY="sklad-app-v1";let products=load(),editId=null;function load(){try{let s=localStorage.getItem(KEY);if(s){let p=JSON.parse(s);if(Array.isArray(p))return p}}catch(e){}return starter.map((p,i)=>({id:i+1,name:p[1],category:p[0],qty:0,min:7}))}function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function toast(s){let e=document.getElementById("toast");e.textContent=s;e.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display="none",1800)}function fillCategories(){categoryFilter.innerHTML='<option value="">Все категории</option>'+categories.map(c=>'<option>'+esc(c)+'</option>').join("");categoryInput.innerHTML=categories.map(c=>'<option>'+esc(c)+'</option>').join("")}function render(){let q=document.getElementById("search").value.trim().toLocaleLowerCase("ru"),cat=document.getElementById("categoryFilter").value,shown=products.filter(p=>(!cat||p.category===cat)&&(!q||(p.name+" "+p.category).toLocaleLowerCase("ru").includes(q))).sort((a,b)=>categories.indexOf(a.category)-categories.indexOf(b.category)||a.name.localeCompare(b.name,"ru"));document.getElementById("totalKinds").textContent=products.length;document.getElementById("totalUnits").textContent=products.reduce((n,p)=>n+(Number(p.qty)||0),0);document.getElementById("lowCount").textContent=products.filter(p=>Number(p.qty)<Number(p.min)).length;document.getElementById("visibleCount").textContent=shown.length+" поз.";document.getElementById("listTitle").textContent=cat||"Все товары";let list=document.getElementById("productList");if(!shown.length){list.innerHTML='<div class="empty">Ничего не найдено.<br>Попробуй изменить поиск или фильтр.</div>';return}let last="";list.innerHTML=shown.map(p=>{let section=p.category!==last?'<div class="sectionhead"><h2>'+esc(p.category)+'</h2></div>':"";last=p.category;let low=Number(p.qty)<Number(p.min);return section+'<article class="product '+(low?'low':'')+'"><div><div class="pname">'+esc(p.name)+'</div><div class="pcat">'+esc(p.category)+'</div><div class="stockline"><span class="stocknum">Мин. '+p.min+' шт.</span>'+(low?'<span class="lowtag">МАЛО</span>':"")+'</div></div><div class="controls"><button class="step" data-action="minus" data-id="'+p.id+'">−</button><span class="qty '+(low?'lowqty':'')+'">'+p.qty+'</span><button class="step plus" data-action="plus" data-id="'+p.id+'">＋</button><button class="mini" data-action="edit" data-id="'+p.id+'">⋯</button></div></article>'}).join("")}function openModal(id=null){editId=id;let p=id?products.find(x=>x.id===id):null;document.getElementById("modalTitle").textContent=p?"Редактировать товар":"Новый товар";document.getElementById("nameInput").value=p?p.name:"";document.getElementById("categoryInput").value=p?p.category:categories[0];document.getElementById("qtyInput").value=p?p.qty:0;document.getElementById("minInput").value=p?p.min:7;document.getElementById("deleteBtn").style.display=p?"block":"none";document.getElementById("overlay").classList.add("open")}function closeModal(){document.getElementById("overlay").classList.remove("open");editId=null}
document.getElementById("productList").addEventListener("click",e=>{let b=e.target.closest("button[data-action]");if(!b)return;let p=products.find(x=>x.id===Number(b.dataset.id));if(!p)return;if(b.dataset.action==="minus"){p.qty=Math.max(0,Number(p.qty)-1);save()}else if(b.dataset.action==="plus"){p.qty=Number(p.qty)+1;save()}else openModal(p.id)});document.getElementById("addBtn").addEventListener("click",()=>openModal());document.getElementById("cancelBtn").addEventListener("click",closeModal);document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});document.getElementById("search").addEventListener("input",render);document.getElementById("categoryFilter").addEventListener("change",render);document.getElementById("clearSearch").addEventListener("click",()=>{document.getElementById("search").value="";render()});document.getElementById("productForm").addEventListener("submit",e=>{e.preventDefault();let name=document.getElementById("nameInput").value.trim(),category=document.getElementById("categoryInput").value,qty=Math.max(0,Number(document.getElementById("qtyInput").value)||0),min=Math.max(0,Number(document.getElementById("minInput").value)||0);if(!name)return;if(editId)Object.assign(products.find(x=>x.id===editId),{name,category,qty,min});else products.push({id:Date.now(),name,category,qty,min});closeModal();save();toast("Сохранено")});document.getElementById("deleteBtn").addEventListener("click",()=>{if(!editId)return;let p=products.find(x=>x.id===editId);if(confirm('Удалить «'+p.name+'»?')){products=products.filter(x=>x.id!==editId);closeModal();save();toast("Товар удалён")}});function exportCSV(){let rows=[["Название","Категория","Остаток","Минимум"],...products.map(p=>[p.name,p.category,p.qty,p.min])],csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="ostatki-sklada.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("Экспорт готов")}document.getElementById("exportBtn").addEventListener("click",exportCSV);document.getElementById("exportCsv").addEventListener("click",exportCSV);fillCategories();render();
</script><script>
/* Связь старого приложения с Firebase */
window.__skladBridge = {
  getProducts: () => products,
  setProducts: (data) => {
    products = data;
    localStorage.setItem(KEY, JSON.stringify(products));
    render();
  }
};

const originalSave = save;

save = function () {
  originalSave();
  if (window.__skladCloudSave) {
    window.__skladCloudSave(products);
  }
};

/* Окно входа */
document.body.insertAdjacentHTML("beforeend", `
<style>
#cloudLogin {
  position:fixed; inset:0; z-index:1000;
  background:#090b10; display:flex;
  align-items:center; justify-content:center;

}
#cloudLogin .loginbox {
  width:100%; max-width:400px;
  background:#131720; border:1px solid #292f3b;
  border-radius:22px; padding:24px;
}
#cloudLogin h2 { margin:0 0 8px; font-size:25px; }
#cloudLogin p { color:#9ba4b3; font-size:14px; line-height:1.5; }

  display:block; width:100%; margin:12px 0;

  color:#fff; font:inherit; box-sizing:border-box;
}

  width:100%; padding:14px; border:0;
  border-radius:12px; background:#b8e986;
  color:#14200d; font:inherit; font-weight:800;

</style>
<div id="cloudLogin">
  <div class="loginbox">

    </div>
    <h2>Вход в систему</h2>
    <p>Войди по почте и паролю, чтобы открыть склад и синхронизировать остатки между устройствами.</p>
    <form id="cloudForm">
      <input id="cloudEmail" type="email" placeholder="Электронная почта" autocomplete="username" required>
      <input id="cloudPassword" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <button id="cloudSubmit" type="submit">Войти в склад</button>

    <p id="cloudMessage" role="status">Подключение к облаку…</p>
  </div>
</div>
`);

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getDatabase, ref, runTransaction, onValue, set
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBaQfmiD4uaJ9jmRhnFC72WcKmE7GkwA",
  authDomain: "sklad-agava.firebaseapp.com",
  databaseURL: "https://sklad-agava-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sklad-agava",
  storageBucket: "sklad-agava.firebasestorage.app",
  messagingSenderId: "771806088401",
  appId: "1:771806088401:web:a08bbb2074df5f6501c9f0",
  measurementId: "G-R5CBVVD7VM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const productsRef = ref(db, "inventory/products");

const login = document.getElementById("cloudLogin");
const form = document.getElementById("cloudForm");
const message = document.getElementById("cloudMessage");
const submit = document.getElementById("cloudSubmit");

let ready = false;
let applyingCloud = false;
let writeQueue = Promise.resolve();

function showMessage(text) {
  message.textContent = text;
}

function normalizeProducts(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === "object") {
    return Object.values(data);
  }
  return [];
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submit.disabled = true;
  showMessage("Выполняем вход…");

  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("cloudEmail").value.trim(),
      document.getElementById("cloudPassword").value
    );
    showMessage("Вход выполнен. Загружаем склад…");
  } catch (error) {
    showMessage(
      error.code === "auth/invalid-credential"
        ? "Неверная почта или пароль."
        : "Не удалось войти: " + error.message
    );
    submit.disabled = false;
  }
});

onAuthStateChanged(auth, async (user) => {
  ready = false;

  if (!user) {
    login.style.display = "flex";
    submit.disabled = false;
    showMessage("Войди с помощью своего аккаунта.");
    return;
  }

  login.style.display = "flex";
  submit.disabled = true;
  showMessage("Подключаем облачный склад…");

  try {
    /*
      Если облако пустое — создаём каталог из текущего приложения.
      Если данные уже есть — сохраняем облачные данные.
    */
    const localProducts = window.__skladBridge.getProducts();

    const result = await runTransaction(productsRef, (current) => {
      return current === null ? localProducts : current;
    });

    if (!result.committed) {
      throw new Error("Не удалось инициализировать склад.");
    }

    const initialData = normalizeProducts(result.snapshot.val());

    applyingCloud = true;
    window.__skladBridge.setProducts(initialData);
    applyingCloud = false;

    onValue(productsRef, (snapshot) => {
      if (!snapshot.exists()) return;

      const cloudProducts = normalizeProducts(snapshot.val());

      applyingCloud = true;
      window.__skladBridge.setProducts(cloudProducts);
      applyingCloud = false;

      ready = true;
      login.style.display = "none";
    }, (error) => {
      showMessage("Ошибка чтения облака: " + error.message);
    });

    ready = true;
    login.style.display = "none";
    if (typeof toast === "function") toast("Облако подключено");
  } catch (error) {
    applyingCloud = false;
    showMessage("Ошибка подключения: " + error.message);
    submit.disabled = false;
  }
});

/* Отправка изменений в Firebase */
window.__skladCloudSave = (products) => {
  if (!ready  || applyingCloud ||  !auth.currentUser) return;

  const data = JSON.parse(JSON.stringify(products));

  writeQueue = writeQueue
    .then(() => set(productsRef, data))
    .catch((error) => {
      console.error("Ошибка синхронизации:", error);
      if (typeof toast === "function") {
        toast("Ошибка облака — проверь соединение");
      }
    });
};
</script></body></html>
